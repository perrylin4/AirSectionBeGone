plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

base {
	archivesName = project.archives_base_name
}

version = project.mod_version
group = project.maven_group

repositories {
	mavenCentral()
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup 'maven.modrinth'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()

	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modImplementation "maven.modrinth:lithium:${project.lithium_version}"
	testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

tasks.named('test') {
	useJUnitPlatform()
}

// A separate mod, loaded only by the explicitly requested integration-test run.
if (providers.gradleProperty('poiIntegrationTest').isPresent()) {
	loom {
		mods {
			'airsectionbegone' { sourceSet sourceSets.main }
			'asbg-poi-test' { sourceSet sourceSets.test }
		}
		runs {
			poiTestServer {
				server()
				source sourceSets.test
				runDir = providers.gradleProperty('poiTestRunDir').getOrElse('build/poi-integration')
				vmArgs '-Xms256m', '-Xmx2G',
						"-Dasbg.poiTest.stage=${providers.gradleProperty('poiTestStage').getOrElse('write')}",
						"-Dasbg.poiTest.requireC2me=${providers.gradleProperty('poiTestRequireC2me').getOrElse('false')}",
						"-Dairsectionbegone.enabled=${providers.gradleProperty('poiTestOptimize').getOrElse('true')}"
				programArgs 'nogui'
			}
		}
	}
	tasks.named('runPoiTestServer') {
		standardInput = System.in
		def expectedStage = providers.gradleProperty('poiTestStage').getOrElse('write')
		doFirst {
			ext.poiTestStartedAt = System.currentTimeMillis()
		}
		doLast {
			def result = new File(workingDir, 'poi-test-result.txt')
			if (!result.isFile() || result.lastModified() < poiTestStartedAt
					|| result.text.trim() != "PASS ${expectedStage}") {
				throw new GradleException('POI integration test did not report a fresh PASS; inspect the test server log.')
			}
		}
	}
}

def resolvedModVersion = project.version

processResources {
	inputs.property 'version', resolvedModVersion

	filesMatching('fabric.mod.json') {
		expand version: resolvedModVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 21
	options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

def bundledLicenseName = "LICENSE_${base.archivesName.get()}"

jar {
	from('LICENSE') {
		rename { bundledLicenseName }
	}
}

tasks.withType(AbstractArchiveTask).configureEach {
	preserveFileTimestamps = false
	reproducibleFileOrder = true
}
